name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Local approval and agent end-to-end flow
        if: runner.os == 'Linux'
        run: node scripts/e2e-local.mjs --phases=B
      - name: Plugin bundle is up to date with packages/mcp
        run: |
          npm run build:plugin --workspace @aria-live/mcp
          git diff --exit-code -- plugin/mcp/aria-live-mcp.mjs

  codex-plugin:
    # Installs plugin/ into the real Codex CLI and checks the MCP tools, the
    # progress hook and the skills it loads (no OpenAI account needed).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --prefix "$RUNNER_TEMP/codex" @openai/codex@0.166.0
      - run: node scripts/check-codex-plugin.mjs
        env:
          CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/codex
